name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          WRB_KEYSTORE: ${{ runner.temp }}/release.jks
          WRB_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CODE=$((GITHUB_RUN_NUMBER + 100))
          echo "$CODE" > code.txt
          gradle assembleRelease --no-daemon -PversionCode="$CODE" -PversionName="$VERSION"
          cp app/build/outputs/apk/release/app-release.apk "Booster-v$VERSION.apk"
          sha256sum "Booster-v$VERSION.apk" | cut -d' ' -f1 > sha.txt

      - name: Publish to Booster-releases
        env:
          DEPLOY_KEY: ${{ secrets.RELEASES_DEPLOY_KEY }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git clone git@github.com:Belin7z/Booster-releases.git rel
          cp "Booster-v$VERSION.apk" rel/
          cp "Booster-v$VERSION.apk" rel/Booster-latest.apk
          VERSION="$VERSION" python3 -c "
          import json, os
          json.dump({
            'versionCode': int(open('code.txt').read()),
            'versionName': os.environ['VERSION'],
            'apk': 'Booster-v' + os.environ['VERSION'] + '.apk',
            'sha256': open('sha.txt').read().strip(),
            'notes': os.environ.get('NOTES', '').strip()[:500]
          }, open('rel/latest.json', 'w'), ensure_ascii=False, indent=2)
          "
          cd rel
          git config user.name "booster-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Release v$VERSION"
          git push origin HEAD:main
