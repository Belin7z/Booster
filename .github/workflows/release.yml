name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          WRB_KEYSTORE: ${{ runner.temp }}/release.jks
          WRB_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CODE=$((GITHUB_RUN_NUMBER + 100))
          echo "$CODE" > code.txt
          gradle assembleRelease --no-daemon -PversionCode="$CODE" -PversionName="$VERSION"
          cp app/build/outputs/apk/release/app-release.apk "Booster-v$VERSION.apk"
          sha256sum "Booster-v$VERSION.apk" | cut -d' ' -f1 > sha.txt

      - name: Notas da versão
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          RANGE="${PREV:+$PREV..}${GITHUB_REF_NAME}"
          [ -z "$PREV" ] && RANGE="-1 ${GITHUB_REF_NAME}"
          {
            echo "## Novidades"
            git log --no-merges --format='- %s' $RANGE
          } > notes.md
          VERSION="${GITHUB_REF_NAME#v}" python3 -c "
          import json, os
          notes = [l[2:] for l in open('notes.md').read().splitlines() if l.startswith('- ')]
          json.dump({
            'versionCode': int(open('code.txt').read()),
            'versionName': os.environ['VERSION'],
            'apk': 'Booster-v' + os.environ['VERSION'] + '.apk',
            'sha256': open('sha.txt').read().strip(),
            'notes': '\n'.join(notes)[:500]
          }, open('latest.json', 'w'), ensure_ascii=False, indent=2)
          "

      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Booster-$GITHUB_REF_NAME.apk" latest.json \
            --title "Booster ${GITHUB_REF_NAME#v}" --notes-file notes.md --latest