plugins {
    id 'com.android.application'
}

def vCode = (findProperty('versionCode') ?: '3').toInteger()
def vName = findProperty('versionName') ?: '2.1'

// A chave vem de variáveis de ambiente (CI) ou de keystore.properties (local, fora do git).
def ksFile = System.getenv('WRB_KEYSTORE')
def ksPass = System.getenv('WRB_PASS')
def localProps = rootProject.file('keystore.properties')
if (ksFile == null && localProps.exists()) {
    def p = new Properties()
    localProps.withInputStream { p.load(it) }
    ksFile = p.getProperty('file')
    ksPass = p.getProperty('password')
}

android {
    namespace 'com.lucie.wrboost'
    compileSdk 34

    defaultConfig {
        applicationId "com.lucie.wrboost"
        minSdk 26
        targetSdk 34
        versionCode vCode
        versionName vName
    }

    signingConfigs {
        if (ksFile != null) {
            release {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias 'wrboost'
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile != null) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'com.github.MuntashirAkon:sun-security-android:1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
}
